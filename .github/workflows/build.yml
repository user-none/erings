name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:
    inputs:
      release:
        description: Build for a release (requires update keys, uploads the release assets)
        type: boolean
        default: false
      update_keys:
        description: Update signing public keys stamped into the binary
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-latest, windows-latest, windows-11-arm]
    env:
      UPDATE_KEYS: ${{ inputs.update_keys }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Determine version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # Release tags are vMAJOR.MINOR.PATCH; the v is only part of the tag
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          fi

      - name: Determine Linux architecture
        if: runner.os == 'Linux'
        run: |
          case "$RUNNER_ARCH" in
            X64) echo "APPIMAGE_ARCH=x86_64" >> "$GITHUB_ENV" ;;
            ARM64) echo "APPIMAGE_ARCH=aarch64" >> "$GITHUB_ENV" ;;
            *) echo "Unsupported Linux runner arch: $RUNNER_ARCH" >&2; exit 1 ;;
          esac

      - name: Determine Windows architecture
        if: runner.os == 'Windows'
        shell: bash
        run: |
          case "$RUNNER_ARCH" in
            X64) echo "WIN_ARCH=amd64" >> "$GITHUB_ENV" ;;
            ARM64) echo "WIN_ARCH=arm64" >> "$GITHUB_ENV" ;;
            *) echo "Unsupported Windows runner arch: $RUNNER_ARCH" >&2; exit 1 ;;
          esac

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libc6-dev libgl1-mesa-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev libasound2-dev pkg-config

      - name: Install AppImage tooling (Linux)
        if: runner.os == 'Linux'
        run: |
          base=https://github.com/linuxdeploy
          wget -q $base/linuxdeploy/releases/download/continuous/linuxdeploy-$APPIMAGE_ARCH.AppImage
          wget -q $base/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-$APPIMAGE_ARCH.AppImage
          chmod +x linuxdeploy-$APPIMAGE_ARCH.AppImage linuxdeploy-plugin-appimage-$APPIMAGE_ARCH.AppImage
          sudo mv linuxdeploy-$APPIMAGE_ARCH.AppImage /usr/local/bin/linuxdeploy
          sudo mv linuxdeploy-plugin-appimage-$APPIMAGE_ARCH.AppImage /usr/local/bin/linuxdeploy-plugin-appimage

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          # The AppImage is a single file and is the release asset as is
          make appimage VERSION="$VERSION" APPIMAGE_ARCH="$APPIMAGE_ARCH" UPDATE_KEYS="$UPDATE_KEYS"

      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make

      - name: Install DirectX Shader Compiler (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Pinned release; the archive holds dxc.exe with dxil.dll beside
          # it, which signs the compiled shaders. The x64 directory serves
          # both runners: its arm64 directory pairs a classic ARM64 dxc.exe
          # with ARM64EC DLLs, which that process cannot load, while the
          # x64 build runs under emulation on the ARM64 runner. The DXIL
          # is the same from either.
          ver=v1.9.2607
          sha256=a1dfb116ba3eeae6a1582291b53a8e7bf65ad760676bd3194685c8f7367cd241
          curl -fL -o dxc.zip "https://github.com/microsoft/DirectXShaderCompiler/releases/download/$ver/dxc_2026_07_29.zip"
          echo "$sha256  dxc.zip" | sha256sum -c -
          powershell -Command "Expand-Archive -Path dxc.zip -DestinationPath C:\\dxc -Force"
          echo "C:\\dxc\\bin\\x64" >> "$GITHUB_PATH"

      - name: Install ARM64 C toolchain (Windows ARM64)
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        shell: bash
        run: |
          # cgo needs a GNU-ABI aarch64 compiler. The runner's gcc is
          # x86_64-w64-mingw32 and its clang is aarch64-pc-windows-msvc, so
          # neither can build cgo for arm64. Fetch a pinned, checksum-verified
          # llvm-mingw toolchain that targets aarch64-w64-mingw32.
          ver=20260616
          sha256=312593669435bd0bfc1a43ac3fba23c8b27e0610bade88b2738e5a01702a99ba
          curl -fL -o llvm-mingw.zip "https://github.com/mstorsjo/llvm-mingw/releases/download/$ver/llvm-mingw-$ver-ucrt-aarch64.zip"
          echo "$sha256  llvm-mingw.zip" | sha256sum -c -
          powershell -Command "Expand-Archive -Path llvm-mingw.zip -DestinationPath C:\\llvm-mingw -Force"
          echo "C:\\llvm-mingw\\llvm-mingw-$ver-ucrt-aarch64\\bin" >> "$GITHUB_PATH"
          echo "CC=aarch64-w64-mingw32-clang" >> "$GITHUB_ENV"
          echo "CXX=aarch64-w64-mingw32-clang++" >> "$GITHUB_ENV"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          make windows VERSION="$VERSION" UPDATE_KEYS="$UPDATE_KEYS"
          cd build
          powershell -Command "Compress-Archive -Path erings.exe -DestinationPath erings-$VERSION-windows-$WIN_ARCH.zip -Force"

      - name: Build (macOS app bundle)
        if: runner.os == 'macOS'
        run: |
          make macos VERSION="$VERSION" UPDATE_KEYS="$UPDATE_KEYS"
          cd build
          zip -r "erings-$VERSION-macos.zip" erings.app

      - name: Check update keys (release)
        if: inputs.release
        shell: bash
        run: |
          # Go records the -ldflags text in the binary's build info, so the
          # keys appear there after the -X variable path. Those copies show
          # the flag named the right variable. The stamped variable adds an
          # occurrence of its own, which is missing when the linker dropped
          # the variable.
          if [ -z "$UPDATE_KEYS" ]; then
            echo "No update keys for a release build" >&2
            exit 1
          fi
          case "$RUNNER_OS" in
            Linux) bin=build/erings ;;
            Windows) bin=build/erings.exe ;;
            macOS) bin=build/erings.app/Contents/MacOS/erings ;;
          esac
          all=$({ grep -o -a -F "$UPDATE_KEYS" "$bin" || true; } | wc -l)
          info=$({ grep -o -a -F "github.com/user-none/erings.updateKeys=$UPDATE_KEYS" "$bin" || true; } | wc -l)
          if (( info == 0 || all <= info )); then
            echo "Update keys are not stamped into $bin" >&2
            exit 1
          fi

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: erings-${{ env.VERSION }}-linux-${{ env.APPIMAGE_ARCH }}
          path: build/erings-${{ env.VERSION }}-${{ env.APPIMAGE_ARCH }}.AppImage

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: erings-${{ env.VERSION }}-windows-${{ env.WIN_ARCH }}
          path: build/erings.exe

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: erings-${{ env.VERSION }}-macos
          path: build/erings.app

      - name: Upload release asset
        if: inputs.release
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ runner.os }}-${{ runner.arch }}
          path: |
            build/erings-*.zip
            build/erings-*.AppImage
          if-no-files-found: error
