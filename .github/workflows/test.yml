name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libc6-dev libgl1-mesa-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev libasound2-dev libgtk-3-dev pkg-config

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  rumble:
    name: Validate rumble files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: true

      - name: Check the rumble directory holds only rumble files
        shell: bash
        run: |
          shopt -s nullglob
          status=0
          for f in gamedata/rumbles/*; do
            case "$f" in
              *.erumble) ;;
              *) echo "not a rumble file: $f" >&2; status=1 ;;
            esac
          done
          exit $status

      - name: Validate
        shell: bash
        run: |
          shopt -s nullglob
          files=(gamedata/rumbles/*.erumble)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no rumble files in gamedata/rumbles" >&2
            exit 1
          fi
          # The validator is the rumble module version in go.mod. The
          # regions are the core's memory map (busTable in core/busmap.go).
          go run github.com/user-none/eblitui/rumble/cmd/validate \
            -strict \
            -region wraml:0x00200000:0x100000 \
            -region wramh:0x06000000:0x100000 \
            "${files[@]}"

  test-windows:
    name: Test (Windows, DX12)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: true

      - name: Install make
        run: choco install make

      - name: Install DirectX Shader Compiler
        shell: bash
        run: |
          ver=v1.9.2607
          sha256=a1dfb116ba3eeae6a1582291b53a8e7bf65ad760676bd3194685c8f7367cd241
          curl -fL -o dxc.zip "https://github.com/microsoft/DirectXShaderCompiler/releases/download/$ver/dxc_2026_07_29.zip"
          echo "$sha256  dxc.zip" | sha256sum -c -
          powershell -Command "Expand-Archive -Path dxc.zip -DestinationPath C:\\dxc -Force"
          echo "C:\\dxc\\bin\\x64" >> "$GITHUB_PATH"

      - name: Compile shaders
        shell: bash
        run: make dxil

      - name: Vet
        shell: bash
        run: go vet ./internal/hostgpu/... ./core/...

      # No hardware adaptor and the software on in the CI will take an hour to run
      # Running a software adapator doesn't actually test anything either
      #- name: Test
      #  shell: bash
      #  run: go test ./internal/hostgpu/... ./core/...
